[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "healthcheck"
version = "1.0.0"
description = "Small CLI that checks HTTP endpoints and reports their health state"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "kat" }]
keywords = ["healthcheck", "monitoring", "cli"]

[project.scripts]
healthcheck = "healthcheck.cli:main"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8",
    "ruff>=0.4",
]

[tool.setuptools]
packages = ["healthcheck"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
