services:
  web:
    build: ./web
    container_name: web-kontti
    networks:
     - frontend-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    container_name: proxy-kontti
    ports:
      - "8080:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  notes-api:
    build: ./notes-api
    container_name: api-kontti
    ports:
      - "3000:3000"
    environment:
      DB_HOST: database
      DB_USER: demo_user
      DB_PASSWORD: demo_password
      DB_NAME: demo_notes
      DB_PORT: 5432
      PORT: 3000
    networks:
     - frontend-network
     - backend-network
    restart: unless-stopped

  database:
      image: postgres:15-alpine
      container_name: database-kontti
      environment:
        POSTGRES_USER: demo_user
        POSTGRES_PASSWORD: demo_password
        POSTGRES_DB: demo_notes
      volumes:
        - pgdata:/var/lib/postgresql/data
      networks:
        - backend-network
      restart: unless-stopped



networks:
  frontend-network:
    driver: bridge
  backend-network:
    driver: bridge