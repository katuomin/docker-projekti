services:
  web:
    build: ./web
    container_name: web-kontti
    networks:
     - frontend-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    container_name: proxy-kontti
    ports:
      - "80:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend-network
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  notes-api:
    build: ./notes-api
    container_name: api-kontti
    ports:
      - "3000:3000"
    environment:
      DB_HOST: database
      DB_USER: demo_user
      DB_PASSWORD: demo_password
      DB_NAME: demo_notes
      DB_PORT: 5432
      PORT: 3000
    networks:
     - frontend-network
     - backend-network
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:3000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  database:
    image: postgres:17-alpine
    container_name: database-kontti
    environment:
      POSTGRES_USER: demo_user
      POSTGRES_PASSWORD: demo_password
      POSTGRES_DB: demo_notes
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:

networks:
  frontend-network:
    driver: bridge
  backend-network:
    internal: true
