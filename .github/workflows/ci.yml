name: CI

on:
  push:
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - '.gitignore'

# Least privilege by default; individual jobs raise this only when needed.
permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    environment: ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff

      - name: Run ruff
        run: ruff check healthcheck tests

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    environment: ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e . pytest

      - name: Run pytest
        run: pytest -v

  package:
    name: Package (build + artifact)
    needs: [lint, test]
    runs-on: ubuntu-latest
    environment: ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: python -m pip install --upgrade pip build && python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: healthcheck-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  stack:
    name: Stack (compose + node)
    runs-on: ubuntu-latest
    environment: ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate docker-compose file
        run: docker compose config -q

      - name: Syntax-check notes-api
        run: node --check notes-api/server.js

      - name: Install notes-api dependencies
        working-directory: notes-api
        run: npm install --no-audit --no-fund

  images:
    name: Build images
    runs-on: ubuntu-latest
    environment: ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build web image
        run: docker build -t web-ci ./web

      - name: Build notes-api image
        run: docker build -t notes-api-ci ./notes-api

  terraform:
    name: Terraform (validate)
    runs-on: ubuntu-latest
    environment: ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Validate terraformlearnerlab
        working-directory: terraformlearnerlab
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

  # Keyless deploy: only runs on v* tags. The job presents a short-lived
  # OIDC token (id-token: write) and assumes an IAM role, so no long-lived
  # credentials are stored anywhere. The role ARN comes from the repo
  # variable DEPLOY_ROLE_ARN.
  deploy:
    name: Deploy (OIDC, keyless)
    needs: [lint, test, package, stack, images, terraform]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Assume IAM role with the OIDC token
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          audience: sts.amazonaws.com
